name: CI

# Quote "on" — YAML 1.1 treats bare `on` as boolean true, which causes
# GitHub Actions startup_failure with zero jobs / "workflow file issue".
"on":
  push:
    branches:
      - main
      - "feat/**"
      - final
      - abonbranch
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BNg_UF-VqzSAgmGRRlzVzXQmqot-dkXs6goaaEwnTqbHNMausVzFrhhplWQVujW1fm8d7bdquc7XVGhqc71SR4c
      VAPID_PRIVATE_KEY: qU4oP6s4Q0UI3I-64Q2xHbfhMCyxRiibOjvx_j4L4gc
      VAPID_SUBJECT: mailto:admin@internetbank.sk
      PUSH_NOTIFICATIONS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: internet_bank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d internet_bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/internet_bank
      BETTER_AUTH_SECRET: ci-better-auth-secret-min-32-chars-long
      BETTER_AUTH_URL: http://localhost:3030
      GUEST_USER_EMAIL: admin@local.test
      GUEST_USER_PASSWORD: admin1234
      APP_PIN: "666666"
      SITE_GATE_ENABLED: "false"
      DISABLE_RATE_LIMIT: "true"
      E2E_TEST_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Presence-only flag for UI status card (no real Mistral calls required for page render)
      MISTRAL_API_KEY: ci-dummy-mistral-key
      MISTRAL_MODEL: mistral-small-latest
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BNg_UF-VqzSAgmGRRlzVzXQmqot-dkXs6goaaEwnTqbHNMausVzFrhhplWQVujW1fm8d7bdquc7XVGhqc71SR4c
      VAPID_PRIVATE_KEY: qU4oP6s4Q0UI3I-64Q2xHbfhMCyxRiibOjvx_j4L4gc
      VAPID_SUBJECT: mailto:admin@internetbank.sk
      PUSH_NOTIFICATIONS_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Ensure database schema + guest user
        run: npx tsx scripts/ensure-db.ts

      - name: Build app
        run: npx next build

      - name: Start app
        run: |
          npx next start -p 3030 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3030/manifest.json >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: E2E chromium
        run: npx playwright test --project=setup --project=chromium
        env:
          # webServer in playwright.config may try build+start; reuse our server
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
